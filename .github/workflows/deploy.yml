name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "jinsblog/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./jinsblog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./jinsblog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx hexo generate

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./jinsblog/public
          publish_branch: gh-pages
          force_orphan: true
