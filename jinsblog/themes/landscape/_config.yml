# ===============
# Nordic Zen Theme Configuration (北欧极简白)
# ===============

# Navigation menu - minimal
menu:
  首页: /

# RSS link
rss: /atom.xml

# No banner - clean minimalist header
banner: ""
subtitle: Tech & Life Notes

# Header social links (empty for now)
links:

# ===============
# Content
# ===============
excerpt_link: 阅读全文
fancybox: true

# ===============
# Footer
# ===============
copyright: All content licensed under CC BY 4.0

# ===============
# Sidebar (左侧边栏 - 北欧风格)
# ===============
sidebar: left

# Widgets
widgets:
- category
- recent_posts
- archive

# ===============
# Widget behavior
# ===============
archive_type: 'monthly'
show_count: true
recent_posts_limits: 5

# ===============
# Miscellaneous
# ===============
favicon: /favicon.png
google_analytics:
gauges_analytics:

# ===============
# Comment system
# ===============
disqus_shortname:
valine:
  enable: false