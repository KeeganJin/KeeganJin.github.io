info:
  title: "Jin's Blog"
  subtitle: 'Machine Learning, AI Agents & Product Docs'
  author: That Jin
  url: https://keeganjin.github.io

defaults:
  favicon: /favicon.ico

colors:
  primary: "#2563eb"
  default_mode: light

global:
  content_max_width: 1000px
  sidebar_width: 210px
  scroll_progress:
    percentage: true
  website_counter:
    enable: false
  single_page: true
  open_graph:
    enable: true
    description: Personal blog about machine learning, AI agents, and product development
  google_analytics:
    enable: false

navbar:
  auto_hide: false
  color:
    left: "#2563eb"
    right: "#1d4ed8"
    transparency: 35
  links:
    首页:
      path: /
      icon: fa-regular fa-house
    技术文档:
      icon: fa-regular fa-folder
      submenus:
        机器学习: /categories/技术文档/机器学习/
        Agent: /categories/技术文档/Agent/
    随笔:
      path: /categories/随笔/
      icon: fa-regular fa-pen-to-square
    EN:
      path: /en/
      icon: fa-regular fa-language
  search:
    enable: false

home_banner:
  enable: true
  style: static
  title: "Jin's Blog"
  subtitle:
    text: ["Machine Learning", "AI Agents", "Product Development"]

home:
  sidebar:
    enable: true
    position: left
    first_item: menu
    show_on_mobile: true
    links:
      归档:
        path: /archives
        icon: fa-regular fa-archive
      分类:
        path: /all-categories
        icon: fa-regular fa-folder
      标签:
        path: /all-tags
        icon: fa-regular fa-tags
  article_date_format: auto
  excerpt_length: 200
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 3

articles:
  word_count:
    enable: true
    count: true
    min2read: true
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: vs2015
  toc:
    enable: true
    max_depth: 3
  copyright:
    enable: true
    default: cc_by_nc_sa
  lazyload: true
  recommendation:
    enable: false

comment:
  enable: false

footer:
  runtime: true
  icon: '<i class="fa-solid fa-heart fa-beat" style="--fa-animation-duration: 0.5s; color: #f54545"></i>'
  start: 2026/05/09 00:00:00
  statistics: true

plugins:
  feed:
    enable: false
  aplayer:
    enable: false
  mermaid:
    enable: false

page_templates:
  tags_style: blur
